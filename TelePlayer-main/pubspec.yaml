name: telegram_media_player
description: A Material 3 Flutter app for browsing and streaming Telegram media through a local range-aware player.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  media_kit_libs_windows_video: ^1.0.11
  path_provider: ^2.1.6
  tdlib: ^1.6.0
  video_player: ^2.13.0
  video_player_media_kit: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
