name: telegram_media_player
description: TelePlayer is a Material 3 app for streaming songs from Telegram.
publish_to: "none"
version: 1.4.8+27

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  just_audio_background: ^0.0.1-beta.17
  just_audio_windows: ^0.2.3
  package_info_plus: ^10.2.1
  permission_handler: ^12.0.3
  path_provider: ^2.1.6
  tdlib: ^1.6.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
