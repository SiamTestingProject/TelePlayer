name: telegram_media_player
description: TelePlayer is a Material 3 app for browsing and streaming Telegram media.
publish_to: "none"
version: 1.1.0+3

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  media_kit_libs_windows_video: ^1.0.11
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  tdlib: ^1.6.0
  url_launcher: ^6.3.2
  video_player: ^2.13.0
  video_player_media_kit: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
